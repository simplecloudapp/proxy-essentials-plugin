[versions]
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"

shadow = "9.6.1"
minotaur = "2.9.0"
blossom = "2.2.0"

slf4j = "2.0.18"

velocity = "4.1.0-SNAPSHOT"
bungeecord = "1.21-R0.4"

adventure = "5.2.0"
adventure-platform = "4.4.1"

configurate-yaml = "4.2.0"
configurate-kotlin = "4.2.0"

simplecloud-api = "0.1.0-platform.54-dev.1.1-770dcc6"
simplecloud-plugin = "0.0.1-platform.1778966459069-b1e45e2"

cloud-command-core = "2.1.0"
cloud-command-velocity = "2.0.1"
cloud-command-bungee = "2.0.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

cloud-command-core = { module = "org.incendo:cloud-core", version.ref = "cloud-command-core" }
cloud-command-coroutines = { module = "org.incendo:cloud-kotlin-coroutines", version.ref = "cloud-command-core" }
cloud-command-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-command-velocity" }
cloud-command-bungee = { module = "org.incendo:cloud-bungee", version.ref = "cloud-command-bungee" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-platform-bungeecord = { module = "net.kyori:adventure-platform-bungeecord", version.ref = "adventure-platform" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate-yaml" }
configurate-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate-kotlin" }

simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }
simplecloud-plugin = { module = "app.simplecloud.plugin:plugin-shared", version.ref = "simplecloud-plugin" }

[bundles]
configurate = ["configurate-yaml", "configurate-kotlin"]
cloud = ["cloud-command-core", "cloud-command-coroutines"]
adventure = ["adventure-api", "adventure-text-minimessage"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }